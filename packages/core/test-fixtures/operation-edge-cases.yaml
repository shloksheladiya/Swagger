openapi: "3.0.0"
info:
  title: Edge Cases API
  version: 1.0.0
security:
  - globalAuth: []
paths:
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      # no operationId — must be synthesized
      # no `security` field at all — must inherit global security
      responses:
        "200":
          description: OK
    delete:
      security: [] # explicitly overrides global with "no auth required"
      responses:
        "204":
          description: Deleted
    put:
      operationId: updateItem
      security:
        - itemAuth: ["write"] # overrides global with a different scheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Updated
components:
  securitySchemes:
    globalAuth:
      type: http
      scheme: bearer
    itemAuth:
      type: apiKey
      in: header
      name: X-Item-Key
