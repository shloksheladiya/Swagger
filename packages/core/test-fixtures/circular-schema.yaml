openapi: "3.0.0"
info:
  title: Circular API
  version: 1.0.0
paths:
  /nodes:
    get:
      operationId: getNode
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeNode"
components:
  schemas:
    TreeNode:
      type: object
      properties:
        label:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
