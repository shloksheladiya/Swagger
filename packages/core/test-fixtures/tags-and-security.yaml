openapi: "3.0.0"
info:
  title: Tagged API
  version: 1.0.0
tags:
  - name: Users
    description: User management
  - name: Admin
security:
  - bearerAuth: []
paths:
  /users:
    get:
      operationId: listUsers
      tags: [Users]
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    legacyBasicAuth:
      type: http
      scheme: basic
    oidcAuth:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
